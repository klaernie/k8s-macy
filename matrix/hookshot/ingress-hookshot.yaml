apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 550m
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
  name: hookshot
  namespace: matrix
spec:
  ingressClassName: nginx
  rules:
    - host: matrix.cloud.ak-online.be
      http:
        paths:
          - backend:
              service:
                name: hookshot
                port:
                  name: webhook
            path: /hookshot/(.*)
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - matrix.cloud.ak-online.be
      secretName: matrix-prod-ingress
