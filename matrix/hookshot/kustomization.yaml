resources:
  - ingress-hookshot.yaml

configMapGenerator:
  - name: hookshot
    files:
      - config/config.yaml
    options:
      disableNameSuffixHash: true

helmCharts:
  - releaseName: hookshot
    repo: https://matrix-org.github.io/matrix-hookshot
    name: hookshot
    version: 0.1.16
    skipTests: true
    valuesFile: values.yaml

namespace: matrix

patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: hookshot
        namespace: matrix
      spec:
        ports:
          - port: 9993
            targetPort: appservice
            protocol: TCP
            name: appservice
          - port: 9002
            targetPort: widgets
            protocol: TCP
            name: widgets
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hookshot
        namespace: matrix
      spec:
        template:
          spec:
            containers:
              - name: hookshot
                ports:
                  - containerPort: 9993
                    name: appservice
                    protocol: TCP
                  - containerPort: 9002
                    name: widgets
                    protocol: TCP
            volumes:
              - name: config
                projected:
                  sources:
                    - configMap:
                        name: hookshot
                        items:
                          - key: config.yaml
                            path: config.yml
                    - secret:
                        name: as-hookshot
                        items:
                          - key: registration.yaml
                            path: registration.yml
                    - secret:
                        name: hookshot
                        items:
                          - key: passkey.pem
                            path: passkey.pem
