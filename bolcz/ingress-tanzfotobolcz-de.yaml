apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: tanzfotobolcz-de
  namespace: bolcz
spec:
  ingressClassName: nginx
  rules:
  - host: &host tanzfotobolcz.de
    http:
      paths:
      - backend:
          service:
            name: nginx
            port:
              number: 80
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - *host
    secretName: tanzfotobolcz-de-tls
